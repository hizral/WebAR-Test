<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR Three.js Tracking</title>
    
    <!-- Critical Safety Patch for Unity Loader -->
    <script>
      if (typeof window !== 'undefined') {
        if (!window.navigator) { window.navigator = {}; }
        if (!window.navigator.userAgent) { 
          window.navigator.userAgent = 'Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/16.0 Mobile/15E148 Safari/604.1'; 
        }
      }
    </script>

    <!-- Import Maps for Three.js and MindAR ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
          "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
        }
      }
    </script>

    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      #ar-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    </style>
  </head>
  <body>
    <!-- Tap-to-start button required for mobile camera permissions -->
    <button id="ar-start-button" onclick="startWebAR()" style="position: absolute; z-index: 999; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
      Start AR Camera
    </button>

    <script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';

      window.startWebAR = async function() {
        const btn = document.getElementById('ar-start-button');
        if (btn) btn.style.display = 'none';

        try {
          // 1. Initialize MindAR Three.js instance
          const mindarThree = new MindARThree({
            container: document.body,
            imageTargetSrc: "TemplateData/targets.mind",
          });

          const { renderer, scene, camera } = mindarThree;

          // 2. Create an anchor for target index 0
          const anchor = mindarThree.addAnchor(0);

          // 3. Create your 3D content (e.g., a colored 3D Cube)
          const geometry = new THREE.BoxGeometry(1, 1, 1);
          const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
          const cube = new THREE.Mesh(geometry, material);
          
          // Position the cube relative to the tracked image target anchor
          cube.position.set(0, 0.4, 0);
          anchor.group.add(cube);

          // 4. Start the AR engine and rendering loop
          await mindarThree.start();

          renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
          });
        } catch (error) {
          console.error("Failed to start WebAR:", error);
          alert("Could not start camera. Please check permissions.");
          const btn = document.getElementById('ar-start-button');
          if (btn) btn.style.display = 'block';
        }
      };
    </script>
  </body>
</html>
