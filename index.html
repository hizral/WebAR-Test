<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebAR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    #ar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
    }
    #unity-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      background: transparent !important;
      pointer-events: auto;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }
    #progress-bar-bg {
      width: 240px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }
    #progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #00d2ff;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="ar-container"></div>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading-overlay">
    <div id="loading-text">Loading WebAR Experience...</div>
    <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
  </div>
  <script type="module" src="webar-controller.js"></script>
  <script>
    window.unityInstance = null;
    const canvas = document.querySelector("#unity-canvas");
    const loadingOverlay = document.querySelector("#loading-overlay");
    const progressFill = document.querySelector("#progress-bar-fill");

    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/WebARBuild.loader.js";
    const config = {
      dataUrl: buildUrl + "/WebARBuild.data",
      frameworkUrl: buildUrl + "/WebARBuild.framework.js",
      codeUrl: buildUrl + "/WebARBuild.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "WebAR",
      productVersion: "0.1.0",
      webglContextAttributes: {
        alpha: true,
        premultipliedAlpha: false,
        preserveDrawingBuffer: false
      }
    };

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressFill.style.width = (progress * 100) + "%";
      }).then((instance) => {
        window.unityInstance = instance;
        loadingOverlay.style.opacity = "0";
        setTimeout(() => loadingOverlay.remove(), 400);
      }).catch((err) => {
        console.error("Unity WebGL Init Error:", err);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
