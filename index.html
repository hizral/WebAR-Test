<script type="module">
      import * as THREE from 'three';
      import { MindARThree } from 'mindar-image-three';

      let unityInstance = null;

      window.startWebAR = async function() {
        const btn = document.getElementById('ar-start-button');
        if (btn) btn.style.display = 'none';

        try {
          const mindarThree = new MindARThree({
            container: document.body,
            imageTargetSrc: "TemplateData/targets.mind",
          });

          const { renderer, scene, camera } = mindarThree;
          const anchor = mindarThree.addAnchor(0);

          await mindarThree.start();

          renderer.setAnimationLoop(() => {
            if (anchor.visible) {
              if (unityInstance != null) {
                unityInstance.SendMessage("WebARManager", "OnTargetFound");
              }
            } else {
              if (unityInstance != null) {
                unityInstance.SendMessage("WebARManager", "OnTargetLost");
              }
            }
            renderer.render(scene, camera);
          });
        } catch (error) {
          console.error("Failed to start MindAR:", error);
          alert("Could not start camera. Make sure camera permissions are allowed.");
          if (btn) btn.style.display = 'block';
        }
      };

      // Ensure navigator properties exist to prevent Unity loader match errors
      if (typeof window.navigator.userAgent =
          = 'undefined') { window.navigator.userAgent = 'CustomBrowser';
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebARBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebARBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebARBuild.framework.js.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HizralWork",
        productName: "WebAR Test",
        productVersion: "0.1.1",
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
        }).then((instance) => {
          unityInstance = instance;
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
