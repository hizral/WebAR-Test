<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Unity 6 WebAR - MindAR</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <!-- Include Three.js and MindAR Production Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
    <style>
      /* Ensure HTML/Body and container allow transparency for the webcam feed */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent !important;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background: transparent !important;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        background: transparent !important;
      }
      /* MindAR auto-generated video styling override to ensure it sits behind canvas */
      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="%UNITY_WEBGL_WIDTH%" height="%UNITY_WEBGL_HEIGHT%"></canvas>
    </div>
    <script>
      var unityInstance = null;
      var mindarThree = null;

      async function initMindAR() {
        try {
          mindarThree = new window.MINDAR.IMAGE.MindARThree({
            container: document.body,
            imageTargetSrc: "StreamingAssets/targets.mind",
          });

          const {renderer, scene, camera} = mindarThree;
          const anchor = mindarThree.addAnchor(0);

          anchor.onTargetFound = () => {
            if (unityInstance) {
              unityInstance.SendMessage("WebARManager", "OnTargetFound");
            }
          };

          anchor.onTargetLost = () => {
            if (unityInstance) {
              unityInstance.SendMessage("WebARManager", "OnTargetLost");
            }
          };

          anchor.group.matrixAutoUpdate = false;

          await mindarThree.start();

          renderer.setAnimationLoop(() => {
            if (anchor.visible && unityInstance) {
              const matrix = anchor.group.matrixWorld;
              const elements = matrix.elements;
              unityInstance.SendMessage("WebARManager", "UpdateTrackingData", JSON.stringify(elements));
            }
          });
        } catch (error) {
          console.error("Failed to initialize MindAR:", error);
        }
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebARBuild.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebARBuild.data.unityweb",
        frameworkUrl: buildUrl + "/WebARBuild.framework.js.unityweb",
        codeUrl: buildUrl + "/WebARBuild.wasm.unityweb",
        memoryUrl: buildUrl + "/",
        symbolUrl: buildUrl + "/",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HizralWork",
        productName: "WebAR Test",
        productVersion: "0.1.1",
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
        }).then((instance) => {
          unityInstance = instance;
          // Start MindAR camera feed once Unity instance is active
          initMindAR();
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
